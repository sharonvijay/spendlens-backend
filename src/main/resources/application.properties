# ========== Server Configuration ==========
server.port=8080
server.servlet.context-path=/
spring.application.name=spendlens-backend

# ========== File Upload Configuration ==========
spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=50MB

# ========== Logging Configuration ==========
logging.level.root=INFO
logging.level.com.spendlens=DEBUG
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} - %msg%n

# ========== Application Info ==========
info.app.name=SpendLens Backend
info.app.description=Personal Finance Tool for Bank Statement Analysis
info.app.version=1.0.0

# ========== Spring AI Configuration ==========
spring.ai.model.chat=google-genai
spring.ai.google.genai.chat.model=gemini-2.0-flash
spring.ai.google.genai.chat.temperature=0.3
spring.ai.google.genai.api-key=${GEMINI_API_KEY_SPENDLENS}